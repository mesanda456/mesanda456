<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a22"/>
      <stop offset="100%" stop-color="#05141c"/>
    </linearGradient>
    <linearGradient id="wifi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes signal-dash {
        to { stroke-dashoffset: -30; }
      }
      @keyframes lantern-pulse-1 {
        0%, 100% { fill: #ff4d6d; filter: drop-shadow(0 0 8px #ff4d6d); }
        50% { fill: #331018; filter: none; }
      }
      @keyframes lantern-pulse-2 {
        0%, 100% { fill: #00d4ff; filter: drop-shadow(0 0 8px #00d4ff); }
        50% { fill: #082833; filter: none; }
      }
      @keyframes lantern-pulse-3 {
        0%, 100% { fill: #00ff9d; filter: drop-shadow(0 0 8px #00ff9d); }
        50% { fill: #0a3320; filter: none; }
      }
      @keyframes lantern-pulse-4 {
        0%, 100% { fill: #ffbe0b; filter: drop-shadow(0 0 8px #ffbe0b); }
        50% { fill: #332605; filter: none; }
      }
      @keyframes wifi-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      .signal-line {
        stroke-dasharray: 6, 4;
        animation: signal-dash 1.2s linear infinite;
      }
      .wifi-arc { animation: wifi-pulse 1.5s ease-in-out infinite; }
      .bulb-1 { animation: lantern-pulse-1 1.2s ease-in-out infinite; }
      .bulb-2 { animation: lantern-pulse-2 1.2s ease-in-out infinite 0.3s; }
      .bulb-3 { animation: lantern-pulse-3 1.2s ease-in-out infinite 0.6s; }
      .bulb-4 { animation: lantern-pulse-4 1.2s ease-in-out infinite 0.9s; }
      .wire-node { fill: #00d4ff; }
      .lbl { font-family: 'Courier New', monospace, 'DM Mono'; font-size: 11px; fill: #e8edf2; }
      .sublbl { font-family: 'Courier New', monospace; font-size: 9px; fill: #6b7f8e; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="2" y="2" width="846" height="196" rx="8" fill="#060c12" stroke="#1f2937" stroke-width="1.5"/>

  <!-- TITLE -->
  <text x="24" y="28" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#00d4ff" letter-spacing="1.5">⚡ EMBEDDED SYSTEM SCHEMATIC: SMART VESAK CONTROLLER (ESP8266 + 4-RELAY)</text>
  <line x1="24" y1="36" x2="826" y2="36" stroke="#1f2937" stroke-width="1"/>

  <!-- NODE 1: SMARTPHONE -->
  <g transform="translate(40, 55)">
    <rect x="0" y="0" width="85" height="110" rx="8" fill="url(#chip-grad)" stroke="#00d4ff" stroke-width="1"/>
    <rect x="8" y="12" width="69" height="75" rx="3" fill="#020608"/>
    <circle cx="42" cy="98" r="4" fill="#00d4ff"/>
    <text x="42" y="38" text-anchor="middle" class="lbl" font-size="10" font-weight="bold" fill="#00ff9d">WEB UI</text>
    <text x="42" y="54" text-anchor="middle" class="sublbl">Phone</text>
    <text x="42" y="68" text-anchor="middle" class="sublbl">Browser</text>
    <text x="42" y="130" text-anchor="middle" class="sublbl">No App Needed</text>
  </g>

  <!-- WiFi Waves -->
  <g transform="translate(135, 110)">
    <path d="M 0,-15 A 25,25 0 0,1 25,0" fill="none" stroke="#00d4ff" stroke-width="2" class="wifi-arc"/>
    <path d="M 0,-25 A 35,35 0 0,1 35,0" fill="none" stroke="#00d4ff" stroke-width="2" class="wifi-arc" style="animation-delay: 0.3s;"/>
    <path d="M 0,-35 A 45,45 0 0,1 45,0" fill="none" stroke="#00ff9d" stroke-width="2" class="wifi-arc" style="animation-delay: 0.6s;"/>
    <text x="18" y="22" class="sublbl" font-size="9" fill="#00d4ff">WiFi 2.4GHz</text>
  </g>

  <!-- NODE 2: ESP8266 Microcontroller -->
  <g transform="translate(225, 55)">
    <rect x="0" y="0" width="140" height="110" rx="6" fill="url(#chip-grad)" stroke="#00ff9d" stroke-width="1.2"/>
    <rect x="15" y="16" width="110" height="78" rx="4" fill="#0b1015" stroke="#1f2937"/>
    <text x="70" y="38" text-anchor="middle" class="lbl" font-size="11" font-weight="bold" fill="#00ff9d">ESP8266</text>
    <text x="70" y="54" text-anchor="middle" class="sublbl">NodeMCU C++</text>
    <text x="70" y="70" text-anchor="middle" class="sublbl">AsyncWebServer</text>
    <text x="70" y="84" text-anchor="middle" class="sublbl" fill="#00d4ff">8 Pattern Algo</text>
    <text x="70" y="130" text-anchor="middle" class="sublbl">Local HTTP Socket</text>
  </g>

  <!-- Signal Bus from ESP to Relays -->
  <path d="M 365,75 L 430,75" fill="none" stroke="#00ff9d" stroke-width="2" class="signal-line"/>
  <path d="M 365,95 L 430,95" fill="none" stroke="#00d4ff" stroke-width="2" class="signal-line"/>
  <path d="M 365,115 L 430,115" fill="none" stroke="#ffbe0b" stroke-width="2" class="signal-line"/>
  <path d="M 365,135 L 430,135" fill="none" stroke="#ff4d6d" stroke-width="2" class="signal-line"/>

  <!-- NODE 3: 4-Channel Optocoupled Relay Bank -->
  <g transform="translate(430, 55)">
    <rect x="0" y="0" width="150" height="110" rx="6" fill="url(#chip-grad)" stroke="#7b5ea7" stroke-width="1.2"/>
    <!-- Relays -->
    <rect x="12" y="10" width="126" height="18" rx="2" fill="#1f2937" stroke="#ff4d6d" stroke-width="1"/>
    <text x="75" y="23" text-anchor="middle" class="sublbl" fill="#ff4d6d">RELAY 1 (D5/GPIO14)</text>

    <rect x="12" y="34" width="126" height="18" rx="2" fill="#1f2937" stroke="#00d4ff" stroke-width="1"/>
    <text x="75" y="47" text-anchor="middle" class="sublbl" fill="#00d4ff">RELAY 2 (D6/GPIO12)</text>

    <rect x="12" y="58" width="126" height="18" rx="2" fill="#1f2937" stroke="#00ff9d" stroke-width="1"/>
    <text x="75" y="71" text-anchor="middle" class="sublbl" fill="#00ff9d">RELAY 3 (D7/GPIO13)</text>

    <rect x="12" y="82" width="126" height="18" rx="2" fill="#1f2937" stroke="#ffbe0b" stroke-width="1"/>
    <text x="75" y="95" text-anchor="middle" class="sublbl" fill="#ffbe0b">RELAY 4 (D8/GPIO15)</text>
    <text x="75" y="130" text-anchor="middle" class="sublbl">Optoisolated 5V</text>
  </g>

  <!-- Power Lines from Relays to Lanterns -->
  <path d="M 580,69 L 660,69" fill="none" stroke="#ff4d6d" stroke-width="2" class="signal-line"/>
  <path d="M 580,93 L 660,93" fill="none" stroke="#00d4ff" stroke-width="2" class="signal-line"/>
  <path d="M 580,117 L 660,117" fill="none" stroke="#00ff9d" stroke-width="2" class="signal-line"/>
  <path d="M 580,141 L 660,141" fill="none" stroke="#ffbe0b" stroke-width="2" class="signal-line"/>

  <!-- NODE 4: Animated Vesak Lantern Zones -->
  <g transform="translate(660, 50)">
    <rect x="0" y="5" width="150" height="115" rx="6" fill="url(#chip-grad)" stroke="#ffbe0b" stroke-width="1.2"/>
    <text x="75" y="24" text-anchor="middle" class="lbl" font-weight="bold" fill="#ffbe0b">🏮 LANTERN ZONES</text>
    
    <!-- Zone 1 -->
    <circle cx="35" cy="50" r="14" class="bulb-1"/>
    <text x="35" y="54" text-anchor="middle" font-size="9" font-family="'Courier New', monospace" font-weight="bold" fill="#000">Z1</text>
    
    <!-- Zone 2 -->
    <circle cx="115" cy="50" r="14" class="bulb-2"/>
    <text x="115" y="54" text-anchor="middle" font-size="9" font-family="'Courier New', monospace" font-weight="bold" fill="#000">Z2</text>
    
    <!-- Zone 3 -->
    <circle cx="35" cy="94" r="14" class="bulb-3"/>
    <text x="35" y="98" text-anchor="middle" font-size="9" font-family="'Courier New', monospace" font-weight="bold" fill="#000">Z3</text>
    
    <!-- Zone 4 -->
    <circle cx="115" cy="94" r="14" class="bulb-4"/>
    <text x="115" y="98" text-anchor="middle" font-size="9" font-family="'Courier New', monospace" font-weight="bold" fill="#000">Z4</text>
    
    <text x="75" y="135" text-anchor="middle" class="sublbl">Active Pulse / Chaser</text>
  </g>
</svg>
