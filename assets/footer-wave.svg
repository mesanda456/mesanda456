<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 90" width="100%" height="90">
  <defs>
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#7b5ea7;#00ff9d;#00d4ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7b5ea7">
        <animate attributeName="stop-color" values="#7b5ea7;#00ff9d;#00d4ff;#7b5ea7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff9d">
        <animate attributeName="stop-color" values="#00ff9d;#00d4ff;#7b5ea7;#00ff9d" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      @keyframes wave-flow {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0); }
      }
      .wave-layer { animation: wave-flow 6s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="950" height="90" fill="#020608" opacity="0" />
  
  <!-- Flowing Gradient Wave Layer -->
  <path class="wave-layer" d="M 0 35 C 180 65, 360 10, 540 45 C 720 75, 850 20, 950 40 L 950 90 L 0 90 Z" fill="url(#footer-grad)" opacity="0.85" />
  
  <!-- Deep Obsidian Contrast Wave Layer -->
  <path d="M 0 50 C 220 20, 480 65, 700 35 C 840 20, 900 50, 950 45 L 950 90 L 0 90 Z" fill="#020608" opacity="0.65" />
</svg>
