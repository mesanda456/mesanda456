<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020608" />
      <stop offset="40%" stop-color="#07121b" />
      <stop offset="70%" stop-color="#041824" />
      <stop offset="100%" stop-color="#020608" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#7b5ea7;#00ff9d;#00d4ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7b5ea7">
        <animate attributeName="stop-color" values="#7b5ea7;#00ff9d;#00d4ff;#7b5ea7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ff9d">
        <animate attributeName="stop-color" values="#00ff9d;#00d4ff;#7b5ea7;#00ff9d" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.75" stroke-opacity="0.06" />
    </pattern>

    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.18; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(1.12); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #00ff9d); }
        50% { opacity: 0.25; filter: none; }
      }
      @keyframes float-node-1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes float-node-2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes cursor-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes cycle-text-1 {
        0%, 28% { opacity: 1; transform: translateY(0px); }
        33%, 95% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes cycle-text-2 {
        0%, 28% { opacity: 0; transform: translateY(10px); }
        33%, 61% { opacity: 1; transform: translateY(0px); }
        66%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes cycle-text-3 {
        0%, 61% { opacity: 0; transform: translateY(10px); }
        66%, 95% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(10px); }
      }
      @keyframes wave-shift {
        0% { transform: translateX(0); }
        50% { transform: translateX(-35px); }
        100% { transform: translateX(0); }
      }

      .glow-orb {
        transform-origin: 475px 120px;
        animation: pulse-glow 5s ease-in-out infinite;
      }
      .live-dot { animation: blink 1.6s ease-in-out infinite; }
      .float-1 { animation: float-node-1 3.5s ease-in-out infinite; }
      .float-2 { animation: float-node-2 4s ease-in-out infinite 0.5s; }
      .float-3 { animation: float-node-1 4.5s ease-in-out infinite 1s; }
      .cursor { animation: cursor-blink 0.9s infinite; }
      .txt-1 { animation: cycle-text-1 9s infinite; }
      .txt-2 { animation: cycle-text-2 9s infinite; }
      .txt-3 { animation: cycle-text-3 9s infinite; }
      .wave-anim { animation: wave-shift 6s ease-in-out infinite; }

      .font-display {
        font-family: 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      }
      .font-mono {
        font-family: 'DM Mono', 'Fira Code', 'Courier New', monospace;
      }
    </style>
  </defs>

  <!-- Main Background Container -->
  <rect x="0" y="0" width="950" height="280" fill="url(#bg-grad)" rx="12" />

  <!-- Cyber Grid Pattern Overlay -->
  <rect x="0" y="0" width="950" height="250" fill="url(#grid-pattern)" />

  <!-- Central Radial Glow Orb -->
  <circle cx="475" cy="120" r="160" fill="url(#wave-grad)" opacity="0.12" filter="url(#cyan-glow)" class="glow-orb" />

  <!-- Sci-Fi HUD Corner Brackets -->
  <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Top-Left -->
    <path d="M 20 40 L 20 20 L 40 20" />
    <circle cx="20" cy="20" r="2" fill="#00d4ff" />
    <!-- Top-Right -->
    <path d="M 930 40 L 930 20 L 910 20" />
    <circle cx="930" cy="20" r="2" fill="#00d4ff" />
    <!-- Bottom-Left -->
    <path d="M 20 215 L 20 235 L 40 235" />
    <!-- Bottom-Right -->
    <path d="M 930 215 L 930 235 L 910 235" />
  </g>

  <!-- Floating Tech Badges (Left Side) -->
  <g class="float-1">
    <rect x="42" y="85" width="88" height="26" rx="13" fill="#081520" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="86" y="102" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#00d4ff">☕ Java EE</text>
  </g>
  <g class="float-2">
    <rect x="30" y="130" width="105" height="26" rx="13" fill="#081520" stroke="#00ff9d" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="82" y="147" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#00ff9d">🌿 Spring Boot</text>
  </g>
  <g class="float-3">
    <rect x="52" y="175" width="80" height="26" rx="13" fill="#081520" stroke="#61dafb" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="92" y="192" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#61dafb">⚛️ React</text>
  </g>

  <!-- Floating Tech Badges (Right Side) -->
  <g class="float-2">
    <rect x="815" y="85" width="95" height="26" rx="13" fill="#081520" stroke="#ff4d6d" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="862" y="102" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#ff4d6d">🤖 ESP8266</text>
  </g>
  <g class="float-1">
    <rect x="805" y="130" width="112" height="26" rx="13" fill="#081520" stroke="#02569b" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="861" y="147" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#38bdf8">📱 Flutter/Dart</text>
  </g>
  <g class="float-3">
    <rect x="820" y="175" width="85" height="26" rx="13" fill="#081520" stroke="#2496ed" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="862" y="192" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#2496ed">🐳 Docker</text>
  </g>

  <!-- Top Center: Live Availability Pill -->
  <g transform="translate(475, 42)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#071822" stroke="#00d4ff" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-145" cy="0" r="4.5" fill="#00ff9d" class="live-dot" />
    <text x="10" y="4" text-anchor="middle" class="font-mono" font-size="10" font-weight="600" fill="#00ff9d" letter-spacing="1">
      OPEN FOR INTERNSHIPS &amp; JUNIOR ROLES
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="475" y="112" text-anchor="middle" class="font-display" font-size="52" font-weight="800" letter-spacing="-1.5" fill="url(#title-grad)" filter="url(#cyan-glow)">
    MESANDA SETHUMIKA
  </text>

  <!-- Tagline Subtitle -->
  <text x="475" y="146" text-anchor="middle" class="font-mono" font-size="14.5" font-weight="500" fill="#88a8be" letter-spacing="1.5">
    ⚡ SOFTWARE ENGINEER <tspan fill="#00d4ff">|</tspan> FULL-STACK WEB <tspan fill="#00ff9d">&amp;</tspan> ROBOTICS ARTIFICER
  </text>

  <!-- Interactive Terminal Text Cycler (Center Pill) -->
  <g transform="translate(475, 186)">
    <rect x="-270" y="-14" width="540" height="28" rx="6" fill="#050d14" stroke="#1c2d3d" stroke-width="1" />
    <circle cx="-252" cy="0" r="3" fill="#ff5f56" />
    <circle cx="-242" cy="0" r="3" fill="#ffbd2e" />
    <circle cx="-232" cy="0" r="3" fill="#27c93f" />

    <!-- Text 1 -->
    <g class="txt-1">
      <text x="8" y="4" text-anchor="middle" class="font-mono" font-size="11.5" fill="#e8edf2">
        <tspan fill="#00d4ff">&gt;</tspan> Java 17 &amp; Spring Boot 3 • MERN Stack • React 18 • Docker
      </text>
    </g>

    <!-- Text 2 -->
    <g class="txt-2">
      <text x="8" y="4" text-anchor="middle" class="font-mono" font-size="11.5" fill="#e8edf2">
        <tspan fill="#00ff9d">&gt;</tspan> ESP8266 WiFi IoT • Embedded C++ • Flutter &amp; Riverpod
      </text>
    </g>

    <!-- Text 3 -->
    <g class="txt-3">
      <text x="8" y="4" text-anchor="middle" class="font-mono" font-size="11.5" fill="#e8edf2">
        <tspan fill="#ffbe0b">&gt;</tspan> Building Real-World Systems in Panadura, Sri Lanka 🇱🇰
      </text>
    </g>

    <text x="252" y="4" class="font-mono cursor" font-size="13" fill="#00d4ff">█</text>
  </g>

  <!-- Fluid Cyber Waving Bottom Border -->
  <path class="wave-anim" d="M 0 252 C 160 270, 320 236, 480 255 C 640 272, 800 240, 950 258 L 950 280 L 0 280 Z" fill="url(#wave-grad)" opacity="0.9" />
  <path d="M 0 262 C 200 248, 440 272, 680 254 C 820 244, 900 264, 950 260 L 950 280 L 0 280 Z" fill="#020608" opacity="0.6" />
</svg>
